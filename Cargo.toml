[package]
name = "sendspin"
version = "0.3.6"
edition = "2021"
authors = ["Sendspin Contributors"]
description = "Hyper-efficient Rust implementation of the Sendspin Protocol for synchronized multi-room audio streaming"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sendspin/sendspin-rs"

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Encryption (Noise KKpsk2 layer, mandatory per spec)
snow = "0.10"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
getrandom = "0.3"

# Error handling
thiserror = "2.0"

# Utilities
log = "0.4"

# Audio output
cpal = "0.18"

# Audio codecs
flac-codec = "=1.3.2"
opus-rs = "=0.1.23"

# Concurrency
crossbeam = "0.8"

# Fast mutexes
parking_lot = "0.12"
typed-builder = "0.23.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# `realtime` promotes cpal's WASAPI event-loop thread via MMCSS ("Pro Audio"),
# falling back to SetThreadPriority(TIME_CRITICAL). Without it the audio
# callback thread runs at normal priority and can miss engine-period deadlines
# under host load, which surfaces as callback gaps and endpoint-buffer
# starvation. Windows-only: CoreAudio already schedules callback threads
# real-time (and cpal has no macOS audio_thread_priority dependency, so the
# feature would be inert), while Linux promotion needs the dbus/RtKit variant
# (realtime-dbus) plus a system libdbus build dependency.
cpal = { version = "0.18", features = ["realtime"] }

[dev-dependencies]
tokio-test = "0.4"
env_logger = "0.11"
# Enables wss:// in dev builds of examples. Needed by local probes that reach
# spec-compliant servers through out-of-spec TLS proxies.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
clap = { version = "4.6", features = ["derive"] }
mdns-sd = "0.20"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
